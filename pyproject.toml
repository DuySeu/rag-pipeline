[project]
name = "rag-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2
    "langchain-community<0.4.2",
    "openai>=1.0",
    "ragas>=0.4.3",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
